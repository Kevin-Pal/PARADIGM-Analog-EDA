name: Deploy project site to GitHub Pages

# Manual for now. GitHub Pages is not enabled on this repository yet -- it cannot be
# while the repository is private on a free plan -- so an automatic push trigger would
# fail on every commit with "Get Pages site failed".
#
# Once the repository is public and Pages is switched on
# (Settings -> Pages -> Source: GitHub Actions), add the push trigger back:
#
#   on:
#     push:
#       branches: [main]
#     workflow_dispatch:
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
